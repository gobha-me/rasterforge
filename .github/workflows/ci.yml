name: CI

# Enforces the AGENTS.md rule: "build on both compilers, always." Every push to
# main and every pull request builds + tests the project on GCC and Clang across
# the default toolchain and each sanitizer, so a change that only builds on one
# compiler fails visibly.
#
# RasterForge keeps its supported compiler floor and sanitizer engagement
# visible in one matrix. Consumer/package shapes are exercised separately.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04   # ships GCC 13 + Clang (both C++23-capable); pinned for reproducibility
    strategy:
      fail-fast: false      # always show every compiler's result, not just the first failure
      matrix:
        include:
          - { name: "gcc / default",   cxx: g++,     toolchain: default.cmake,   build_type: Debug }
          - { name: "gcc / asan",      cxx: g++,     toolchain: address.cmake,   build_type: Debug }
          - { name: "gcc / tsan",      cxx: g++,     toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "gcc / ubsan",     cxx: g++,     toolchain: undefined.cmake, build_type: Debug }
          - { name: "clang / default", cxx: clang++, toolchain: clang.cmake,     build_type: Debug }
          - { name: "clang / asan",    cxx: clang++, toolchain: address.cmake,   build_type: Debug }
          - { name: "clang / tsan",    cxx: clang++, toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "clang / ubsan",   cxx: clang++, toolchain: undefined.cmake, build_type: Debug }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history + tags so cmake/version.cmake's `git describe --tags` resolves a real version

      # GCC jobs use the preinstalled g++ (13). The clang jobs, however, must NOT
      # use ubuntu-24.04's stock clang 18: its libstdc++ pairing cannot compile
      # RasterForge's C++23 std::expected API. Pin the jobs to a known-good Clang
      # so "both compilers, always" stays honest. The
      # symlinks make `clang++` resolve to the pinned version, so clang.cmake's
      # find_program(clang++) and the sanitizer toolchains' $CXX all pick it up.
      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
          clang++ --version

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}   # default/sanitizer toolchains respect $CXX; clang.cmake selects clang itself
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/${{ matrix.toolchain }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Runs the Catch2 suites, sanitizer engagement smoke test, artifact
        # enforcement, and version parser self-test.
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: clang / fuzz smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Clang
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION" /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Verify checked-in corpus
        run: python3 fuzz/generate_corpus.py --check

      - name: Configure fuzz target
        run: >
          cmake -B build-fuzz
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/fuzz.cmake
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -Drasterforge_BUILD_BIN=OFF
          -Drasterforge_TESTS=OFF
          -Drasterforge_INSTALL=OFF
          -Drasterforge_FUZZERS=ON

      - name: Build fuzz targets
        run: >
          cmake --build build-fuzz --parallel
          --target rasterforge-decode-fuzzer rasterforge-fit-fuzzer

      - name: Run bounded decode fuzz smoke
        run: |
          mkdir -p build-fuzz/decode-artifacts
          cmake -E copy_directory fuzz/corpus/decode build-fuzz/decode-corpus
          build-fuzz/fuzz/rasterforge-decode-fuzzer build-fuzz/decode-corpus \
            -runs=256 -max_len=4096 -timeout=2 -rss_limit_mb=512 \
            -artifact_prefix=build-fuzz/decode-artifacts/

      - name: Run bounded fit fuzz smoke
        run: |
          mkdir -p build-fuzz/fit-artifacts
          cmake -E copy_directory fuzz/corpus/fit build-fuzz/fit-corpus
          build-fuzz/fuzz/rasterforge-fit-fuzzer build-fuzz/fit-corpus \
            -runs=512 -max_len=1024 -timeout=2 -rss_limit_mb=512 \
            -artifact_prefix=build-fuzz/fit-artifacts/

  # Prove the all-components-disabled shape configures and does not install a
  # stray package config. The CLI links the library, so it is disabled too.
  lib-off:
    name: library disabled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure, build, and install with the library off
        run: |
          set -euo pipefail
          NAME=$(basename "$GITHUB_WORKSPACE")
          cmake -B build "-D${NAME}_BUILD_LIB=OFF" "-D${NAME}_BUILD_BIN=OFF" "-D${NAME}_TESTS=OFF"
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/prefix"

          for unexpected in prefix/lib/cmake prefix/include prefix/bin; do
            if [ -e "${unexpected}" ]; then
              echo "::error::${unexpected} exists, but every installable component is disabled"
              ls -R prefix
              exit 1
            fi
          done

  # The consuming-project path, which nothing else here covers: every job above
  # builds this repo as the top-level project, so a regression in the
  # PROJECT_IS_TOP_LEVEL guards, the install/export rules or the public usage
  # requirements would go unnoticed until a downstream project hit it.
  #
  # example/consumer/verify.sh builds a miniature downstream project three ways —
  # add_subdirectory, FetchContent, and an installed find_package — and runs the
  # result each time. Both compilers, because a usage requirement can propagate
  # on one and not the other.
  consumer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "consumer / gcc",   cxx: g++ }
          - { name: "consumer / clang", cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same pin and rationale as the build matrix above.
      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++

      - name: Consume the library three ways
        env:
          CXX: ${{ matrix.cxx }}
        run: example/consumer/verify.sh

  # Exercise both codec acquisition paths as library-only installed packages.
  # The system row confirms no fallback was populated. The fetched row proves
  # the pinned zlib/libpng install exports are resolved downstream.
  codec-package:
    name: codec package / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        source: [system, fetched]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure maintained system codec packages are present
        if: ${{ matrix.source == 'system' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev zlib1g-dev libjpeg-turbo8-dev

      - name: Verify codec package path
        run: example/consumer/verify-dependencies.sh ${{ matrix.source }}

  # The one path this project cannot exercise as itself: a fork whose library
  # links a FetchContent'd dependency into its own exported interface. Our
  # library links nothing, so the harness synthesises such a fork and asserts
  # that the install/export files survive being copied into it.
  #
  # One compiler on purpose. The failure this guards against happens during
  # CMake generation, before a translation unit is compiled, so a matrix would
  # buy nothing; the per-compiler half of consuming this project is already
  # covered by the two jobs above. Its own job rather than a step in those, so a
  # red check names the cause without opening a log.
  public-dep:
    name: public dependency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consume a fork that has a public dependency
        run: example/public-dep/verify.sh

  # Fast, dependency-free guard: the git-describe version parser self-test on its
  # own (no compiler, no network). It also runs inside every build job above via
  # ctest; this job gives quick, isolated feedback.
  version-selftest:
    name: version parser self-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run version_selftest.cmake
        run: cmake -P cmake/version_selftest.cmake
      - name: Verify exported archive version
        run: >
          cmake
          -DSOURCE_DIR="$PWD"
          -DWORK_DIR="$PWD/build-version/version-archive-selftest"
          -P cmake/version_archive_selftest.cmake
